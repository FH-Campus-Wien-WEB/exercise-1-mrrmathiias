<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies!</title>
    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        article {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            font-weight: bold;
        }

        img {
            max-width: 200px;
            border-radius: 10px;
            display: block;
            margin-bottom: 10px;
        }

        .genre {
            background-color: #007BFF;
            color: white;
            padding: 5px 10px;
            margin-right: 5px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.9em;
        }

        p {
            margin: 8px 0;
        }
    </style>
    <script>
        const xhr = new XMLHttpRequest();

        xhr.open("GET", "/movies");

        xhr.onload = function () {
            const movies = JSON.parse(xhr.responseText);

            const body = document.body;

            movies.forEach(movie => {

                // Create main container
                const article = document.createElement("article");

                // Title
                const title = document.createElement("h1");
                title.textContent = movie.Title;

                // Poster
                const img = document.createElement("img");
                img.src = movie.Poster;
                img.alt = movie.Title;

                // Info (released + runtime)
                const info = document.createElement("p");
                info.textContent = `Released: ${movie.Released} | Runtime: ${movie.Runtime} min`;

                // Ratings
                const ratings = document.createElement("p");
                ratings.textContent = `IMDb: ${movie.imdbRating} | Metascore: ${movie.Metascore}`;

                // Genres
                const genresDiv = document.createElement("div");
                movie.Genres.forEach(genre => {
                    const span = document.createElement("span");
                    span.className = "genre";
                    span.textContent = genre;
                    genresDiv.appendChild(span);
                });

                // Directors
                const directors = document.createElement("p");
                directors.textContent = "Directors: " + movie.Directors.join(", ");

                // Writers
                const writers = document.createElement("p");
                writers.textContent = "Writers: " + movie.Writers.join(", ");

                // Actors
                const actors = document.createElement("p");
                actors.textContent = "Actors: " + movie.Actors.join(", ");

                // Plot
                const plot = document.createElement("p");
                plot.textContent = movie.Plot;

                // Append everything
                article.appendChild(title);
                article.appendChild(img);
                article.appendChild(info);
                article.appendChild(ratings);
                article.appendChild(genresDiv);
                article.appendChild(directors);
                article.appendChild(writers);
                article.appendChild(actors);
                article.appendChild(plot);

                body.appendChild(article);
            });
        };

        xhr.send();
    </script>

</head>

<body>
</body>

</html>
